<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>SVGP-IDS Digital ID</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            margin: auto;
        }

        .card {
            background: white;
            border-radius: 20px;
            overflow: hidden;
            box-shadow:
                0 10px 40px
                rgba(0,0,0,0.15);
        }

        .header {
            background: #111827;
            color: white;
            text-align: center;
            padding: 22px;
        }

        .header h1 {
            margin: 0;
            font-size: 25px;
        }

        .header p {
            margin: 6px 0 0;
            opacity: 0.8;
        }

        .loading {
            text-align: center;
            padding: 40px 20px;
            color: #666;
        }

        .error {
            display: none;
            padding: 30px 20px;
            text-align: center;
            color: #dc2626;
            font-weight: bold;
        }

        .photo-container {
            text-align: center;
            padding: 25px 20px 10px;
        }

        #studentPhoto {
            display: none;
            width: 180px;
            height: 220px;
            object-fit: cover;
            border-radius: 12px;
            border: 3px solid #e5e7eb;
        }

        .details {
            display: none;
            padding: 20px;
        }

        .row {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            padding: 13px 0;
            border-bottom: 1px solid #eeeeee;
        }

        .label {
            color: #666666;
        }

        .value {
            font-weight: bold;
            text-align: right;
            word-break: break-word;
        }

        .status {
            text-align: center;
            padding: 15px;
            color: #666;
            font-size: 13px;
            word-break: break-all;
        }

    </style>

</head>


<body>

<div class="container">

    <div class="card">

        <div class="header">

            <h1>
                SVGP-IDS
            </h1>

            <p>
                Digital Student ID
            </p>

        </div>


        <!-- Loading -->

        <div
            id="loading"
            class="loading"
        >
            Student details loading...
        </div>


        <!-- Error -->

        <div
            id="error"
            class="error"
        ></div>


        <!-- Photo -->

        <div
            id="photoContainer"
            class="photo-container"
        >

            <img
                id="studentPhoto"
                alt="Student Photo"
            >

        </div>


        <!-- Details -->

        <div
            id="details"
            class="details"
        >

            <div class="row">

                <span class="label">
                    PIN
                </span>

                <span
                    id="studentPIN"
                    class="value"
                ></span>

            </div>


            <div class="row">

                <span class="label">
                    Year
                </span>

                <span
                    id="studentYear"
                    class="value"
                ></span>

            </div>


            <div class="row">

                <span class="label">
                    Branch
                </span>

                <span
                    id="studentBranch"
                    class="value"
                ></span>

            </div>


            <div class="row">

                <span class="label">
                    Image
                </span>

                <span
                    id="studentFile"
                    class="value"
                ></span>

            </div>

        </div>


        <div
            id="status"
            class="status"
        ></div>

    </div>

</div>


<script>

/* =========================================
   APPS SCRIPT WEB APP
========================================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbxxpk0ldccr8Q4NDsle2xwY3Q7RO5xvEk31eMMz229HOC391ozZ1e_Y7NDlcUd7s8dAHA/exec";


/* =========================================
   LOAD STUDENT
========================================= */

async function loadStudent() {

    const loading =
        document.getElementById(
            "loading"
        );

    const error =
        document.getElementById(
            "error"
        );

    const details =
        document.getElementById(
            "details"
        );

    const photo =
        document.getElementById(
            "studentPhoto"
        );

    const status =
        document.getElementById(
            "status"
        );


    /* -----------------------------
       GET PIN
    ----------------------------- */

    const params =
        new URLSearchParams(
            window.location.search
        );


    const pin =
        params.get("pin");


    console.log(
        "QR PIN:",
        pin
    );


    /* -----------------------------
       PIN MISSING
    ----------------------------- */

    if (!pin) {

        loading.style.display =
            "none";

        error.textContent =
            "Student PIN URL lo ledu.";

        error.style.display =
            "block";

        return;

    }


    status.textContent =
        "PIN: " + pin;


    try {

        /* -----------------------------
           API REQUEST
        ----------------------------- */

        const response =
            await fetch(
                API_URL +
                "?action=student&pin=" +
                encodeURIComponent(pin)
            );


        const data =
            await response.json();


        console.log(
            "Student API:",
            data
        );


        if (
            !data.success ||
            !data.student
        ) {

            throw new Error(
                data.error ||
                "Student not found"
            );

        }


        const student =
            data.student;


        /* -----------------------------
           STUDENT DETAILS
        ----------------------------- */

        document.getElementById(
            "studentPIN"
        ).textContent =
            student.pin ||
            "-";


        document.getElementById(
            "studentYear"
        ).textContent =
            student.year ||
            "-";


        document.getElementById(
            "studentBranch"
        ).textContent =
            student.branch ||
            "-";


        document.getElementById(
            "studentFile"
        ).textContent =
            student.fileName ||
            "-";


        /* -----------------------------
           PHOTO
        ----------------------------- */

        photo.onload =
            function() {

                photo.style.display =
                    "inline-block";

            };


        photo.onerror =
            function() {

                console.error(
                    "Image failed:",
                    student.thumbnailUrl
                );

                status.textContent =
                    "Student data vachindi, kani Drive image public access lo ledu.";

            };


        photo.src =
            student.thumbnailUrl;


        /* -----------------------------
           SHOW DETAILS
        ----------------------------- */

        loading.style.display =
            "none";

        details.style.display =
            "block";


        status.textContent =
            "Student ID loaded successfully.";


    } catch (error) {

        console.error(error);


        loading.style.display =
            "none";


        error.textContent =
            "Student load failed: " +
            error.message;


        error.style.display =
            "block";

    }

}


/* =========================================
   START
========================================= */

loadStudent();

</script>

</body>

</html>
