<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width,initial-scale=1.0"
>

<title>SVGP | ID Verification</title>

<style>

*{
    box-sizing:border-box;
}

body{
    margin:0;

    font-family:
    Arial,
    Helvetica,
    sans-serif;

    background:
    linear-gradient(
        135deg,
        #eef1ff,
        #fff0ff
    );

    min-height:100vh;
}

.header{
    background:#10152f;

    color:white;

    padding:20px;

    text-align:center;
}

.header h1{
    margin:0;

    font-size:20px;
}

.header p{
    margin:6px 0 0;

    font-size:10px;

    opacity:.7;
}

.container{
    width:94%;

    max-width:570px;

    margin:35px auto;
}

.card{
    background:white;

    border-radius:20px;

    overflow:hidden;

    box-shadow:
    0 15px 50px
    rgba(30,20,90,.14);
}

.card-top{
    background:
    linear-gradient(
        135deg,
        #6434df,
        #d83fe7
    );

    color:white;

    text-align:center;

    padding:25px;
}

.card-top h2{
    margin:0;

    font-size:19px;
}

.card-top p{
    margin:5px 0 0;

    font-size:10px;
}

.content{
    padding:25px;
}

.photo{
    text-align:center;
}

.photo img{
    width:150px;
    height:190px;

    object-fit:cover;

    border-radius:12px;

    border:5px solid white;

    box-shadow:
    0 5px 20px
    rgba(0,0,0,.12);
}

.row{
    display:flex;

    border-bottom:
    1px solid #edf0f5;

    padding:11px 0;
}

.label{
    width:40%;

    color:#8b8e9e;

    font-size:11px;
}

.value{
    width:60%;

    font-size:12px;

    font-weight:bold;
}

.valid{
    margin-top:20px;

    padding:17px;

    border-radius:12px;

    text-align:center;

    background:#e9fff2;

    border:2px solid #16a05d;

    color:#08753e;
}

.valid strong{
    font-size:15px;
}

.invalid{
    padding:40px 25px;

    text-align:center;

    color:#d00000;

    background:#fff0f0;

    border:2px solid #e32929;

    margin:20px;

    border-radius:14px;
}

.invalid-icon{
    font-size:55px;
}

.loading{
    padding:60px;

    text-align:center;

    color:#777;
}

</style>

</head>


<body>


<header class="header">

<h1>
S.V. GOVERNMENT POLYTECHNIC
</h1>

<p>
TIRUPATI • DIGITAL ID VERIFICATION
</p>

</header>


<main
class="container"
id="app"
>

<div class="card">

<div class="loading">
Verifying Digital ID...
</div>

</div>

</main>


<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbxxpk0ldccr8Q4NDsle2xwY3Q7RO5xvEk31eMMz229HOC391ozZ1e_Y7NDlcUd7s8dAHA/exec";


function getPIN(){

    return new URLSearchParams(
        location.search
    ).get("pin");

}


async function verify(){

    const pin =
    getPIN();


    if(!pin){

        showInvalid(
            "Student PIN is missing."
        );

        return;

    }


    try{

        const response =
        await fetch(

            API_URL+
            "?action=student&pin="+
            encodeURIComponent(pin)+
            "&t="+
            Date.now()

        );


        const data =
        await response.json();


        if(
            !data.success ||
            !data.student
        ){

            showInvalid(
                "This ID card is no longer active."
            );

            return;

        }


        showStudent(
            data.student
        );


    }catch(error){

        document
        .getElementById("app")
        .innerHTML = `

        <div class="card">

            <div class="invalid">

                <div class="invalid-icon">
                    ⚠
                </div>

                <h2>
                    VERIFICATION ERROR
                </h2>

                <p>
                    Unable to connect to
                    the verification server.
                </p>

            </div>

        </div>

        `;

    }

}


function showStudent(student){

    document
    .getElementById("app")
    .innerHTML = `

    <div class="card">

        <div class="card-top">

            <h2>
                S.V. GOVERNMENT POLYTECHNIC
            </h2>

            <p>
                TIRUPATI
            </p>

        </div>


        <div class="content">

            <div class="photo">

                <img
                src="${safe(student.thumbnailUrl)}"
                onerror="photoError()"
                >

            </div>


            <div style="margin-top:20px">

                <div class="row">

                    <div class="label">
                        PIN / ROLL NO.
                    </div>

                    <div class="value">
                        ${safe(student.pin)}
                    </div>

                </div>


                <div class="row">

                    <div class="label">
                        YEAR
                    </div>

                    <div class="value">
                        ${safe(student.year)}
                    </div>

                </div>


                <div class="row">

                    <div class="label">
                        BRANCH
                    </div>

                    <div class="value">
                        ${safe(student.branch)}
                    </div>

                </div>


                <div class="row">

                    <div class="label">
                        FILE
                    </div>

                    <div class="value">
                        ${safe(student.fileName)}
                    </div>

                </div>

            </div>


            <div class="valid">

                <strong>
                    ✓ VALID DIGITAL ID
                </strong>

                <br>

                <small>
                    Student record successfully verified.
                </small>

            </div>

        </div>

    </div>

    `;

}


function showInvalid(message){

    document
    .getElementById("app")
    .innerHTML = `

    <div class="card">

        <div class="invalid">

            <div class="invalid-icon">
                ✕
            </div>

            <h2>
                INVALID ID CARD
            </h2>

            <p>
                ${safe(message)}
            </p>

            <p>
                This QR code is not associated
                with an active student record.
            </p>

        </div>

    </div>

    `;

}


function photoError(){

    showInvalid(
        "Student image was removed or is no longer available."
    );

}


function safe(value){

    return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


verify();

</script>

</body>

</html>
