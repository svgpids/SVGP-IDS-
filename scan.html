<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta
name="viewport"
content="width=device-width, initial-scale=1.0"
>

<title>SVGP-IDS Digital ID</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    min-height: 100vh;

    font-family:
        Arial,
        sans-serif;

    background:
        #f3f4f6;

    padding: 20px;

}

.container {

    width: 100%;

    max-width: 450px;

    margin: auto;

}

.card {

    background: white;

    border-radius: 20px;

    overflow: hidden;

    box-shadow:
        0 10px 40px
        rgba(0,0,0,.15);

}

.header {

    background:
        #111827;

    color: white;

    text-align: center;

    padding: 22px;

}

.header h1 {

    margin: 0;

    font-size: 25px;

}

.header p {

    margin: 7px 0 0;

    opacity: .8;

}

.loading {

    padding: 40px 20px;

    text-align: center;

    color: #666;

}

.error {

    display: none;

    padding: 30px 20px;

    text-align: center;

    color: #dc2626;

    font-weight: bold;

}

.photo-container {

    padding: 25px 20px 10px;

    text-align: center;

}

#studentPhoto {

    display: none;

    width: 180px;

    height: 220px;

    object-fit: cover;

    border-radius: 12px;

    border: 3px solid #e5e7eb;

}

.details {

    display: none;

    padding: 20px;

}

.row {

    display: flex;

    justify-content: space-between;

    gap: 15px;

    padding: 13px 0;

    border-bottom:
        1px solid #eeeeee;

}

.label {

    color: #666;

}

.value {

    font-weight: bold;

    text-align: right;

    word-break: break-word;

}

.status {

    text-align: center;

    padding: 15px;

    font-size: 13px;

    color: #666;

    word-break: break-all;

}

</style>

</head>

<body>


<div class="container">

<div class="card">


<div class="header">

<h1>
SVGP-IDS
</h1>

<p>
Digital Student ID
</p>

</div>


<div
id="loading"
class="loading">

Student details loading...

</div>


<div
id="error"
class="error">
</div>


<div
class="photo-container">

<img
id="studentPhoto"
alt="Student Photo"
>

</div>


<div
id="details"
class="details">


<div class="row">

<span class="label">
PIN
</span>

<span
id="studentPIN"
class="value">
</span>

</div>


<div class="row">

<span class="label">
Year
</span>

<span
id="studentYear"
class="value">
</span>

</div>


<div class="row">

<span class="label">
Branch
</span>

<span
id="studentBranch"
class="value">
</span>

</div>


<div class="row">

<span class="label">
Image
</span>

<span
id="studentFile"
class="value">
</span>

</div>


</div>


<div
id="status"
class="status">
</div>


</div>

</div>


<script>


/* ==========================================
   APPS SCRIPT API
========================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbxxpk0ldccr8Q4NDsle2xwY3Q7RO5xvEk31eMMz229HOC391ozZ1e_Y7NDlcUd7s8dAHA/exec";


/* ==========================================
   LOAD STUDENT
========================================== */

async function loadStudent() {


    const loading =
        document.getElementById(
            "loading"
        );


    const errorBox =
        document.getElementById(
            "error"
        );


    const details =
        document.getElementById(
            "details"
        );


    const photo =
        document.getElementById(
            "studentPhoto"
        );


    const status =
        document.getElementById(
            "status"
        );


    /* -----------------------------
       READ QR PARAMETER
    ----------------------------- */

    const params =
        new URLSearchParams(
            window.location.search
        );


    const pin =
        params.get("pin");


    console.log(
        "QR PIN =",
        pin
    );


    /* -----------------------------
       NO PIN
    ----------------------------- */

    if (!pin) {

        loading.style.display =
            "none";


        errorBox.textContent =
            "QR URL lo PIN ledu.";


        errorBox.style.display =
            "block";


        return;

    }


    status.textContent =
        "Searching: " +
        pin;


    try {


        /* -----------------------------
           API
        ----------------------------- */

        const url =
            API_URL +
            "?action=student&pin=" +
            encodeURIComponent(
                pin
            );


        console.log(
            "API URL =",
            url
        );


        const response =
            await fetch(url);


        if (!response.ok) {

            throw new Error(
                "API HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        console.log(
            "API DATA =",
            data
        );


        if (
            !data.success ||
            !data.student
        ) {

            throw new Error(
                data.error ||
                "Student not found"
            );

        }


        const student =
            data.student;


        /* -----------------------------
           DETAILS
        ----------------------------- */

        document.getElementById(
            "studentPIN"
        ).textContent =
            student.pin ||
            "-";


        document.getElementById(
            "studentYear"
        ).textContent =
            student.year ||
            "-";


        document.getElementById(
            "studentBranch"
        ).textContent =
            student.branch ||
            "-";


        document.getElementById(
            "studentFile"
        ).textContent =
            student.fileName ||
            "-";


        /* -----------------------------
           IMAGE
        ----------------------------- */

        photo.onload =
            function() {

                photo.style.display =
                    "inline-block";

            };


        photo.onerror =
            function() {

                status.textContent =
                    "Student found, but Drive image access problem.";

            };


        photo.src =
            student.thumbnailUrl;


        /* -----------------------------
           SHOW
        ----------------------------- */

        loading.style.display =
            "none";


        details.style.display =
            "block";


        status.textContent =
            "Student ID loaded successfully.";

    }


    catch (error) {


        console.error(
            error
        );


        loading.style.display =
            "none";


        errorBox.textContent =
            "Student load failed: " +
            error.message;


        errorBox.style.display =
            "block";


    }

}


/* ==========================================
   START
========================================== */

loadStudent();

</script>

</body>

</html>
