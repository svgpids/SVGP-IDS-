<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Branch Portal - SVGP Tirupati</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
<link rel="stylesheet" href="branch-dashboard.css" />
</head>
<body>

<nav class="navbar">
  <div class="nav-left">
    <button class="mobile-toggle-btn" id="mobileTreeToggle"><i class="fas fa-bars"></i></button>
    <div class="brand">
      <div class="brand-icon"><i class="fas fa-graduation-cap"></i></div>
      <div>
        <span class="portal-title" id="portalHeaderTitle">BRANCH PORTAL</span>
        <span class="college-sub">S.V. GOVERNMENT POLYTECHNIC, TIRUPATI</span>
      </div>
    </div>
  </div>
  
  <div class="nav-right">
    <div class="live-clock">
      <i class="fas fa-clock"></i>
      <span id="clockTime">--:--:--</span>
    </div>
    <div class="logout-timer" id="logoutTimer">
      <i class="fas fa-hourglass-half"></i>
      <span id="timerDisplay">10:00</span>
    </div>
    <div class="user-pill">
      <i class="fas fa-user-circle"></i>
      <span id="activeBranchTag">DECE</span>
    </div>
    <button class="logout-btn" id="btnLogout">
      <i class="fas fa-sign-out-alt"></i>
      <span>Logout</span>
    </button>
  </div>
</nav>

<div class="layout-container">
  <aside class="sidebar-tree" id="sidebarTree">
    <div class="sidebar-header">
      <h3><i class="fas fa-folder-tree"></i> Drive Directory</h3>
      <button class="close-sidebar-btn" id="closeSidebarBtn"><i class="fas fa-times"></i></button>
    </div>
    <div class="tree-root">
      <div class="tree-item is-root"><i class="fab fa-google-drive"></i><span>SVGP_IDS</span></div>
      <div class="tree-children">
        <div class="tree-node active" data-year="all"><i class="fas fa-folder folder-icon"></i><span class="node-label">All Years</span><span class="node-badge" id="badgeAll">0</span></div>
        <div class="tree-node" data-year="1st year"><i class="fas fa-folder folder-icon"></i><span class="node-label">1st Year</span><span class="node-badge" id="badge1st">0</span></div>
        <div class="tree-node" data-year="2nd year"><i class="fas fa-folder folder-icon"></i><span class="node-label">2nd Year</span><span class="node-badge" id="badge2nd">0</span></div>
        <div class="tree-node" data-year="3rd year"><i class="fas fa-folder folder-icon"></i><span class="node-label">3rd Year</span><span class="node-badge" id="badge3rd">0</span></div>
      </div>
    </div>
    <div class="branch-meta-box">
      <div class="meta-row"><span>Active Branch</span><strong id="metaBranchCode">DECE</strong></div>
      <div class="meta-row"><span>Selected Folder</span><strong id="metaFolderYear">All Years</strong></div>
    </div>
  </aside>
  <div class="sidebar-overlay" id="sidebarOverlay"></div>

  <main class="main-content">
    <div class="controls-card">
      <div class="year-pills-bar">
        <button class="pill-btn active" data-year="all">All Years</button>
        <button class="pill-btn" data-year="1st year">1st Year</button>
        <button class="pill-btn" data-year="2nd year">2nd Year</button>
        <button class="pill-btn" data-year="3rd year">3rd Year</button>
      </div>
      <div class="search-row">
        <div class="search-input-wrap">
          <i class="fas fa-search search-icon"></i>
          <input type="text" id="searchInput" placeholder="Search by PIN or file name..." />
          <button class="clear-search-btn" id="clearSearchBtn" style="display:none;"><i class="fas fa-times"></i></button>
        </div>
        <div class="stats-counter"><i class="fas fa-users"></i><span id="statsCounter">0 Students</span></div>
      </div>
    </div>

    <div class="gallery-area">
      <div class="state-box" id="loadingState" style="display:none;"><i class="fas fa-spinner fa-spin"></i><h4>Loading...</h4></div>
      <div class="state-box" id="emptyState" style="display:none;"><i class="fas fa-folder-open"></i><h4 id="emptyMsg">No photos found</h4></div>
      <div class="cards-grid" id="photoCardsGrid"></div>
    </div>
  </main>
</div>

<div class="image-modal-overlay" id="imageModal">
  <div class="modal-card">
    <div class="modal-header">
      <div class="modal-title-wrap"><h3 id="modalPinTitle">PIN</h3><span id="modalMetaSubtitle">DECE • 2nd Year</span></div>
      <button class="close-modal-btn" id="closeImageModal"><i class="fas fa-times"></i></button>
    </div>
    <div class="modal-img-wrap"><img id="modalPreviewImg" src="" alt="Preview" /></div>
    <div class="modal-footer">
      <button class="action-btn" id="btnCopyPin"><i class="fas fa-copy"></i> Copy PIN</button>
      <a class="action-btn primary" id="btnOpenDrive" href="#" target="_blank"><i class="fab fa-google-drive"></i> Open in Drive</a>
    </div>
  </div>
</div>

<div class="toast-notice" id="toastNotice"><i class="fas fa-check-circle"></i><span id="toastMsg">Copied!</span></div>

<script src="branch-dashboard.js"></script>
</body>
</html>
