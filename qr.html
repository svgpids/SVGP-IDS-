<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SVGP-IDS QR Generator</title>

    <!-- QR Generator -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

    <!-- ZIP Generator -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            color: #111827;
        }

        .container {
            width: 95%;
            max-width: 1200px;
            margin: 30px auto;
        }

        .header {
            background: white;
            padding: 25px;
            border-radius: 16px;
            box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
            margin-bottom: 20px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 28px;
        }

        .subtitle {
            color: #6b7280;
        }

        .controls {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            padding: 13px 20px;
            border-radius: 9px;
            background: #111827;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        button:hover {
            opacity: 0.9;
        }

        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .progress-container {
            margin-top: 20px;
            background: #e5e7eb;
            height: 18px;
            border-radius: 20px;
            overflow: hidden;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: #2563eb;
            transition: width 0.2s;
        }

        #status {
            margin-top: 12px;
            font-weight: bold;
        }

        .grid {
            margin-top: 20px;
            display: grid;
            grid-template-columns: repeat(
                auto-fill,
                minmax(190px, 1fr)
            );
            gap: 15px;
        }

        .student-card {
            background: white;
            border-radius: 12px;
            padding: 15px;
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.07);
        }

        .student-card h3 {
            margin: 5px 0;
            font-size: 15px;
        }

        .student-card p {
            margin: 3px;
            color: #6b7280;
            font-size: 12px;
        }

        .qr {
            display: flex;
            justify-content: center;
            margin: 12px 0;
        }

        .qr img {
            width: 150px !important;
            height: 150px !important;
        }

        .download-btn {
            width: 100%;
            padding: 9px;
            font-size: 12px;
            background: #2563eb;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="header">

        <h1>SVGP-IDS QR Generator</h1>

        <div class="subtitle">
            Google Drive → Student PIN → Automatic QR
        </div>

        <div class="controls">

            <button id="loadBtn" onclick="loadStudents()">
                Load 908 Students
            </button>

            <button
                id="generateBtn"
                onclick="generateAllQR()"
                disabled
            >
                Generate All QR
            </button>

            <button
                id="zipBtn"
                onclick="downloadZIP()"
                disabled
            >
                Download All QR ZIP
            </button>

        </div>

        <div class="progress-container">

            <div
                id="progressBar"
                class="progress-bar"
            ></div>

        </div>

        <div id="status">
            Ready
        </div>

    </div>


    <div
        id="grid"
        class="grid"
    ></div>

</div>


<script>

/* =========================================
   APPS SCRIPT API
========================================= */

const API_URL =
"https://script.google.com/macros/s/AKfycbxxpk0ldccr8Q4NDsle2xwY3Q7RO5xvEk31eMMz229HOC391ozZ1e_Y7NDlcUd7s8dAHA/exec";


/* =========================================
   WEBSITE SCAN PAGE
========================================= */

const SCAN_PAGE =
"https://svgpids.github.io/SVGP-IDS-/scan.html";


/* =========================================
   DATA
========================================= */

let students = [];

let qrList = [];


/* =========================================
   LOAD STUDENTS
========================================= */

async function loadStudents() {

    const loadBtn =
        document.getElementById("loadBtn");

    const generateBtn =
        document.getElementById("generateBtn");

    const status =
        document.getElementById("status");


    loadBtn.disabled = true;

    status.textContent =
        "Google Drive data loading...";


    try {

        const response =
            await fetch(
                API_URL + "?action=files"
            );


        const data =
            await response.json();


        if (!data.success) {

            throw new Error(
                data.error ||
                "API failed"
            );

        }


        students =
            data.files || [];


        status.textContent =
            students.length +
            " students loaded.";


        generateBtn.disabled =
            students.length === 0;


    } catch (error) {

        console.error(error);

        status.textContent =
            "Error: " +
            error.message;

        loadBtn.disabled = false;

    }

}


/* =========================================
   GENERATE ALL QR
========================================= */

async function generateAllQR() {

    const grid =
        document.getElementById("grid");

    const status =
        document.getElementById("status");

    const progressBar =
        document.getElementById("progressBar");

    const generateBtn =
        document.getElementById("generateBtn");

    const zipBtn =
        document.getElementById("zipBtn");


    if (!students.length) {

        alert(
            "First Load Students click cheyyi."
        );

        return;

    }


    generateBtn.disabled = true;

    zipBtn.disabled = true;

    grid.innerHTML = "";

    qrList = [];


    for (
        let i = 0;
        i < students.length;
        i++
    ) {

        const student =
            students[i];


        /* -----------------------------
           QR URL
        ----------------------------- */

        const qrURL =
            SCAN_PAGE +
            "?pin=" +
            encodeURIComponent(
                student.pin
            );


        /* -----------------------------
           CARD
        ----------------------------- */

        const card =
            document.createElement("div");

        card.className =
            "student-card";


        const title =
            document.createElement("h3");

        title.textContent =
            student.pin;


        const year =
            document.createElement("p");

        year.textContent =
            student.year ||
            "-";


        const branch =
            document.createElement("p");

        branch.textContent =
            student.branch ||
            "-";


        const qr =
            document.createElement("div");

        qr.className =
            "qr";


        const download =
            document.createElement("button");

        download.className =
            "download-btn";

        download.textContent =
            "Download QR";


        card.appendChild(title);

        card.appendChild(year);

        card.appendChild(branch);

        card.appendChild(qr);

        card.appendChild(download);

        grid.appendChild(card);


        /* -----------------------------
           CREATE QR
        ----------------------------- */

        new QRCode(
            qr,
            {
                text: qrURL,
                width: 150,
                height: 150,
                correctLevel:
                    QRCode.CorrectLevel.H
            }
        );


        /*
         * Wait for QR image
         */

        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    5
                )
        );


        const img =
            qr.querySelector("img");


        if (img) {

            const item = {

                pin:
                    student.pin,

                data:
                    img.src

            };


            qrList.push(item);


            download.onclick =
                function() {

                    const link =
                        document.createElement(
                            "a"
                        );

                    link.href =
                        img.src;

                    link.download =
                        student.pin +
                        ".png";

                    link.click();

                };

        }


        /* -----------------------------
           PROGRESS
        ----------------------------- */

        const percent =
            Math.round(
                ((i + 1) /
                    students.length) *
                100
            );


        progressBar.style.width =
            percent + "%";


        status.textContent =
            "Generating QR " +
            (i + 1) +
            " / " +
            students.length;

    }


    status.textContent =
        "All " +
        students.length +
        " QR codes generated.";


    zipBtn.disabled =
        qrList.length === 0;

}


/* =========================================
   DOWNLOAD ALL ZIP
========================================= */

async function downloadZIP() {

    if (!qrList.length) {

        alert(
            "QR codes generate cheyyaledu."
        );

        return;

    }


    const status =
        document.getElementById(
            "status"
        );


    const zipBtn =
        document.getElementById(
            "zipBtn"
        );


    zipBtn.disabled =
        true;


    status.textContent =
        "Creating ZIP...";


    const zip =
        new JSZip();


    for (
        const item of qrList
    ) {

        const base64 =
            item.data.split(",")[1];


        zip.file(
            item.pin + ".png",
            base64,
            {
                base64: true
            }
        );

    }


    const blob =
        await zip.generateAsync({
            type: "blob"
        });


    const url =
        URL.createObjectURL(blob);


    const link =
        document.createElement("a");


    link.href =
        url;


    link.download =
        "SVGP-IDS-QR-CODES.zip";


    link.click();


    URL.revokeObjectURL(
        url
    );


    status.textContent =
        "ZIP downloaded successfully.";


    zipBtn.disabled =
        false;

}

</script>

</body>

</html>
