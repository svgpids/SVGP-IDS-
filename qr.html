<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>SVGP-IDS QR Generator</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f3f4f6;
    color: #111827;
}

.container {
    width: 95%;
    max-width: 1100px;
    margin: 30px auto;
}

.header {
    background: white;
    padding: 25px;
    border-radius: 16px;
    box-shadow: 0 8px 30px rgba(0,0,0,.08);
}

h1 {
    margin: 0;
}

.subtitle {
    margin-top: 8px;
    color: #6b7280;
}

.controls {
    margin-top: 20px;
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
}

button {
    border: 0;
    padding: 13px 20px;
    border-radius: 9px;
    background: #111827;
    color: white;
    cursor: pointer;
    font-size: 15px;
}

button:disabled {
    opacity: .5;
    cursor: not-allowed;
}

.progress {
    margin-top: 20px;
    width: 100%;
    height: 18px;
    background: #e5e7eb;
    border-radius: 20px;
    overflow: hidden;
}

.progress-bar {
    width: 0%;
    height: 100%;
    background: #2563eb;
}

#status {
    margin-top: 12px;
    font-weight: bold;
}

.grid {
    margin-top: 25px;
    display: grid;
    grid-template-columns:
        repeat(auto-fill, minmax(300px, 1fr));
    gap: 20px;
}

.student-card {
    background: white;
    padding: 20px;
    border-radius: 15px;
    text-align: center;
    box-shadow: 0 5px 20px rgba(0,0,0,.08);
}

.student-card h2 {
    font-size: 18px;
    margin: 0 0 5px;
}

.student-card p {
    color: #666;
    margin: 4px;
}

.qr {
    margin: 20px auto;
    padding: 15px;
    width: 430px;
    max-width: 100%;
    background: white;
    display: flex;
    justify-content: center;
    align-items: center;
}

.qr img,
.qr canvas {
    width: 400px !important;
    height: 400px !important;
    max-width: 100%;
}

.url {
    font-size: 12px;
    color: #555;
    word-break: break-all;
    margin: 10px 0;
}

.download {
    width: 100%;
    background: #2563eb;
}

</style>

</head>

<body>

<div class="container">

<div class="header">

<h1>SVGP-IDS QR Generator</h1>

<div class="subtitle">
Google Drive Students → Automatic QR
</div>

<div class="controls">

<button
id="loadBtn"
onclick="loadStudents()">
Load Students
</button>

<button
id="generateBtn"
onclick="generateQRs()"
disabled>
Generate QR
</button>

</div>

<div class="progress">

<div
id="progressBar"
class="progress-bar">
</div>

</div>

<div id="status">
Ready
</div>

</div>


<div
id="grid"
class="grid">
</div>

</div>


<script>

/* ==========================================
   APPS SCRIPT URL
========================================== */

const API_URL =
"https://script.google.com/macros/s/AKfycbxxpk0ldccr8Q4NDsle2xwY3Q7RO5xvEk31eMMz229HOC391ozZ1e_Y7NDlcUd7s8dAHA/exec";


/* ==========================================
   YOUR SCAN PAGE
========================================== */

const SCAN_PAGE =
"https://svgpids.github.io/SVGP-IDS-/scan.html";


let students = [];


/* ==========================================
   LOAD STUDENTS
========================================== */

async function loadStudents() {

    const status =
        document.getElementById("status");

    const loadBtn =
        document.getElementById("loadBtn");

    const generateBtn =
        document.getElementById("generateBtn");


    loadBtn.disabled = true;

    status.textContent =
        "Loading students from Google Drive...";


    try {

        const response =
            await fetch(
                API_URL + "?action=files"
            );


        if (!response.ok) {
            throw new Error(
                "API HTTP error: " +
                response.status
            );
        }


        const data =
            await response.json();


        if (!data.success) {

            throw new Error(
                data.error ||
                "API failed"
            );

        }


        students =
            data.files || [];


        status.textContent =
            students.length +
            " students loaded.";


        if (students.length > 0) {

            generateBtn.disabled =
                false;

        }


    } catch (error) {

        console.error(error);

        status.textContent =
            "Error: " +
            error.message;

        loadBtn.disabled =
            false;

    }

}


/* ==========================================
   CREATE QR URL
========================================== */

function getQRURL(pin) {

    pin =
        String(pin)
        .trim();


    return (
        SCAN_PAGE +
        "?pin=" +
        encodeURIComponent(pin)
    );

}


/* ==========================================
   GENERATE ALL QR
========================================== */

async function generateQRs() {

    const grid =
        document.getElementById("grid");

    const status =
        document.getElementById("status");

    const progress =
        document.getElementById("progressBar");

    const generateBtn =
        document.getElementById("generateBtn");


    if (!students.length) {

        alert(
            "First Load Students click cheyyi."
        );

        return;

    }


    generateBtn.disabled =
        true;

    grid.innerHTML = "";


    for (
        let i = 0;
        i < students.length;
        i++
    ) {

        const student =
            students[i];


        const pin =
            String(
                student.pin
            ).trim();


        const qrURL =
            getQRURL(pin);


        /* -----------------------------
           CARD
        ----------------------------- */

        const card =
            document.createElement(
                "div"
            );

        card.className =
            "student-card";


        const title =
            document.createElement(
                "h2"
            );

        title.textContent =
            pin;


        const year =
            document.createElement(
                "p"
            );

        year.textContent =
            "Year: " +
            (
                student.year ||
                "-"
            );


        const branch =
            document.createElement(
                "p"
            );

        branch.textContent =
            "Branch: " +
            (
                student.branch ||
                "-"
            );


        const qr =
            document.createElement(
                "div"
            );

        qr.className =
            "qr";


        const urlText =
            document.createElement(
                "div"
            );

        urlText.className =
            "url";

        urlText.textContent =
            qrURL;


        const download =
            document.createElement(
                "button"
            );

        download.className =
            "download";

        download.textContent =
            "Download QR";


        card.appendChild(title);

        card.appendChild(year);

        card.appendChild(branch);

        card.appendChild(qr);

        card.appendChild(urlText);

        card.appendChild(download);

        grid.appendChild(card);


        /* -----------------------------
           GENERATE QR
        ----------------------------- */

        new QRCode(
            qr,
            {
                text: qrURL,

                width: 400,

                height: 400,

                colorDark:
                    "#000000",

                colorLight:
                    "#ffffff",

                correctLevel:
                    QRCode.CorrectLevel.H
            }
        );


        /* -----------------------------
           WAIT
        ----------------------------- */

        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    20
                )
        );


        const qrImage =
            qr.querySelector(
                "img"
            );


        /* -----------------------------
           DOWNLOAD
        ----------------------------- */

        download.onclick =
            function() {

                if (!qrImage) {

                    alert(
                        "QR image ready kaaledu."
                    );

                    return;

                }


                const link =
                    document.createElement(
                        "a"
                    );


                link.href =
                    qrImage.src;


                link.download =
                    pin +
                    ".png";


                document.body.appendChild(
                    link
                );


                link.click();


                link.remove();

            };


        /* -----------------------------
           PROGRESS
        ----------------------------- */

        const percent =
            Math.round(
                (
                    (i + 1) /
                    students.length
                ) * 100
            );


        progress.style.width =
            percent + "%";


        status.textContent =
            "QR " +
            (i + 1) +
            " / " +
            students.length;


        /*
         * Give browser time to render
         */

        await new Promise(
            resolve =>
                setTimeout(
                    resolve,
                    10
                )
        );

    }


    status.textContent =
        "All QR codes generated successfully.";

}


/* ==========================================
   START
========================================== */

</script>

</body>

</html>
