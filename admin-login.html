<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - S.V. Government Polytechnic</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/admin.css">
</head>
<body class="login-body">

  <div class="login-wrapper">
    <div class="login-card">
      <div class="login-logo-box">
        <div class="gov-seal">🏛️</div>
        <h2>S.V. GOVERNMENT POLYTECHNIC</h2>
        <p>TIRUPATI • Administration Access</p>
      </div>

      <div class="login-form-area">
        <label for="adminPin">Administrative Security PIN</label>
        <input type="password" id="adminPin" placeholder="Enter PIN (Default: 1234)" autocomplete="off">
        <button id="btnLogin" class="btn-login-submit">Unlock Dashboard</button>
        <p id="errorMsg" class="login-error-text" style="display: none;">PIN sirrii miti! Irra deebi'aa yaalaa.</p>
      </div>

      <div class="login-footer-info">
        <p>Government of Andhra Pradesh • SBTET</p>
      </div>
    </div>
  </div>

  <script>
    document.getElementById('btnLogin').addEventListener('click', function() {
      const pin = document.getElementById('adminPin').value.trim();
      const err = document.getElementById('errorMsg');
      
      // Default Security PIN: 1234
      if (pin === "1234") {
        sessionStorage.setItem("admin_auth", "true");
        window.location.href = "admin-dashboard.html";
      } else {
        err.style.display = "block";
      }
    });
  </script>
</body>
</html>
